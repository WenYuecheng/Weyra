name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install development tools
        run: python -m pip install '.[dev,tui]'
      - name: Lint
        run: python -m ruff check .
      - name: Verify application and terminal interface offline
        run: python scripts/verify_source.py
      - name: Build wheel and source distribution
        run: python -m build
      - name: Install built application and check dependencies
        run: |
          python -m venv /tmp/weyra-installed
          /tmp/weyra-installed/bin/python -m pip install dist/*.whl
          /tmp/weyra-installed/bin/python -m pip check
          cd /tmp
          /tmp/weyra-installed/bin/weyra --help
          /tmp/weyra-installed/bin/weyra --demo --project /tmp/weyra-demo
