[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weyra"
version = "0.1.0"
description = "A lightweight, inspectable Python agent harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["openai>=1.0", "anthropic>=0.25", "jsonschema>=4.20"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9", "build>=1"]

[project.scripts]
weyra = "weyra.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
